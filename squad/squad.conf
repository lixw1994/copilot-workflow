# copilot-workflow squad config (installer-managed: template upgrades overwrite
# this file; runtime location is .herdr/squad.conf)
#
# Format: <role> <kind> [args...]
#   role  Role name matching .herdr/roles/<role>.md
#   kind  An agent kind supported by the installed Herdr version (see `herdr agent`)
#   args  Native arguments passed to the agent executable (e.g. --model xxx;
#         argument values must not contain spaces)
#
# Comment out or delete a line to disable that role.
# Local customization: copy this file to .herdr/squad.local.conf and edit it
# (whole-file precedence; never touched by the installer; the entire .herdr/
# stays out of version control).
#
researcher   grok    --model grok-4.6 --reasoning-effort xhigh
writer       pi      --provider google-vertex --model gemini-3.7-flash
worker       codex   --model gpt-5.6-sol -c model_reasoning_effort=medium
